name: Test Non-IaC Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  run-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Steampipe
        uses: turbot/steampipe-action-setup@v1

      - name: Install Powerpipe
        run: |
          sudo /bin/sh -c "$(curl -fsSL https://powerpipe.io/install/powerpipe.sh)"

      - name: Start Steampipe and Powerpipe
        run: |
          steampipe -v
          powerpipe -v
          steampipe service start

      - name: Run Control
        uses: ./ # This points to your local action
        with:
          mod-url: "https://github.com/pskrbasu/powerpipe-demo-mod"
          controls: |
            sample_control_1

      - name: Stop
        run: |
          steampipe service stop

  run-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Steampipe
        uses: turbot/steampipe-action-setup@v1

      - name: Install Powerpipe
        run: |
          sudo /bin/sh -c "$(curl -fsSL https://powerpipe.io/install/powerpipe.sh)"

      - name: Start Steampipe and Powerpipe
        run: |
          steampipe -v
          powerpipe -v
          steampipe service start

      - name: Run Benchmark
        uses: ./ # This points to your local action
        with:
          mod-url: "https://github.com/pskrbasu/powerpipe-demo-mod"
          benchmarks: |
            control_summary_benchmark

      - name: Stop
        run: |
          steampipe service stop

  test-database-flag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Powerpipe
        run: |
          sudo /bin/sh -c "$(curl -fsSL https://powerpipe.io/install/powerpipe.sh)"

      - name: Verify Powerpipe is installed
        run: |
          powerpipe -v

      - name: Run Control
        uses: ./ # This points to your local action
        with:
          mod-url: "https://github.com/pskrbasu/powerpipe-mod-duckdb-demo"
          controls: |
            testing_control
          database: "duckdb:///$(pwd)/test_data/employee.duckdb"
